services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: neonterminal, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment: {VITE_API_URL: http://localhost:8000}
volumes: {pgdata:}
